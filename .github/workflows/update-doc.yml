name: Update Drive Document

on:
  workflow_dispatch:
    inputs:
      file_id:
        required: true
        type: string
      pending_file:
        required: true
        type: string
      doc_name:
        required: false
        default: document
        type: string

jobs:
  update-document:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests --quiet

      - name: Diagnose environment
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
          FILE_ID: ${{ inputs.file_id }}
          PENDING_FILE: ${{ inputs.pending_file }}
        run: |
          echo "=== File check ==="
          ls -la "$PENDING_FILE" && echo "FILE_OK" || echo "FILE_MISSING"
          echo "=== Python check ==="
          python3 --version
          python3 -c "
          import os, sys
          pf = os.environ.get('PENDING_FILE', 'NOT_SET')
          url = os.environ.get('APPS_SCRIPT_URL', 'NOT_SET')
          sec = os.environ.get('APPS_SCRIPT_SECRET', 'NOT_SET')
          fid = os.environ.get('FILE_ID', 'NOT_SET')
          print('PENDING_FILE:', pf)
          print('FILE_ID:', fid)
          print('APPS_SCRIPT_URL length:', len(url))
          print('APPS_SCRIPT_SECRET length:', len(sec))
          if os.path.exists(pf):
              with open(pf) as f:
                  line = f.readline().strip()
              print('First line:', line)
          else:
              print('FILE DOES NOT EXIST at:', pf)
          "
          echo "=== HTTP test to Apps Script ==="
          python3 -c "
          import os, requests
          url = os.environ.get('APPS_SCRIPT_URL','')
          if not url:
              print('No URL set')
          else:
              try:
                  r = requests.post(url, json={'secret': os.environ.get('APPS_SCRIPT_SECRET',''), 'action': 'test'}, timeout=15)
                  print('HTTP status:', r.status_code)
                  print('Response:', r.text[:300])
              except Exception as e:
                  print('Exception:', type(e).__name__, str(e)[:200])
          "
