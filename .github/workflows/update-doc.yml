name: Update Drive Document

on:
  workflow_dispatch:
    inputs:
      file_id:
        required: true
        type: string
      pending_file:
        required: true
        type: string
      doc_name:
        required: false
        default: document
        type: string

jobs:
  update-document:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install google-auth google-auth-httplib2 google-api-python-client markdown --quiet

      - name: Update Drive file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FILE_ID: ${{ inputs.file_id }}
          PENDING_FILE: ${{ inputs.pending_file }}
          DOC_NAME: ${{ inputs.doc_name }}
        run: python3 scripts/update_drive.py

      - name: Delete temp content file
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF2'
          import os, requests
          token = os.environ["GITHUB_TOKEN"]
          path  = "${{ inputs.pending_file }}"
          repo  = "${{ github.repository }}"
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github+json"}
          sha = requests.get(f"https://api.github.com/repos/{repo}/contents/{path}", headers=headers).json().get("sha","")
          r = requests.delete(f"https://api.github.com/repos/{repo}/contents/{path}",
              headers=headers,
              json={"message": f"cleanup: ${{ inputs.doc_name }}", "sha": sha})
          print("Cleanup:", r.status_code, "✅" if r.status_code == 200 else "⚠️")
          PYEOF2

      - name: Confirm success
        if: success()
        run: echo "✅ ${{ inputs.doc_name }} updated successfully."
